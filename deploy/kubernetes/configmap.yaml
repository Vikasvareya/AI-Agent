apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: ai-agent
data:
  AI_AGENT_HOST: "0.0.0.0"
  AI_AGENT_PORT: "8080"
  AI_AGENT_REQUIRE_AUTH: "true"
  AI_AGENT_API_PORT: "8081"
  AI_AGENT_API_HOST: "0.0.0.0"
  AI_AGENT_COOKIE_SECURE: "true"
  AI_AGENT_CODING_AUDIT_RETENTION_DAYS: "365"
  AI_AGENT_PROVIDER: "ollama"
  OLLAMA_HOST: "http://ollama.ai-agent.svc.cluster.local:11434"
  OLLAMA_MODEL: "llama3.2"
  OPENAI_COMPATIBLE_BASE_URL: "https://api.openai.com/v1"
  OPENAI_COMPATIBLE_MODEL: "gpt-4o-mini"
  OPENAI_COMPATIBLE_TIMEOUT: "60"
