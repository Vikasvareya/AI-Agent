apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secrets
  namespace: ai-agent
type: Opaque
stringData:
  AI_AGENT_ADMIN_TOKEN: "replace-with-a-unique-admin-token"
  AI_AGENT_USER_TOKEN: "replace-with-a-unique-user-token"
  AI_AGENT_USER_TOKENS: "{\"replace-with-user-token\":\"tenant-a:user-1\"}"
  AI_AGENT_CHAT_DATABASE: "postgresql://ai_agent:replace-password@postgres.example.internal:5432/ai_agent"
